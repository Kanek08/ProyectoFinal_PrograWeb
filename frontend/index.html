<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CompuPartes Xela · Ventas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-body-tertiary">
  <!-- Barra superior: la llena js/main.js según haya sesión o no. -->
  <nav class="navbar navbar-expand-md navbar-dark bg-success" id="barra"></nav>

  <!-- Indicador de carga (F6): visible mientras haya peticiones en curso. -->
  <div id="cargando" class="cargando" role="status" aria-live="polite" hidden>
    <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
    <span>Cargando…</span>
  </div>

  <!-- Toda la aplicación se dibuja aquí con el patrón estado → render. -->
  <main id="app" class="container py-3"></main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
